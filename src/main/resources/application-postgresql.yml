# PostgreSQL 配置文件
# 使用方式：spring-boot --spring.profiles.active=postgresql
# 或设置环境变量 SPRING_PROFILES_ACTIVE=postgresql
#
# 连接信息必须通过环境变量提供；数据库需安装 vector 扩展。

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spring-ai-skills-demo}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}

  # 禁用 H2 控制台（PostgreSQL 不需要）
  h2:
    console:
      enabled: false

  # Spring AI 配置 - 使用 PostgreSQL
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
            platform: postgresql

# 日志配置
logging:
  level:
    org.springframework.jdbc: ${SPRING_JDBC_LOG_LEVEL:INFO}
