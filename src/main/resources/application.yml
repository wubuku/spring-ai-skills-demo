spring:
  application:
    name: spring-ai-skills-demo

  # 项目显式创建两个命名 VectorStore，避免自动配置生成第三个歧义 Bean。
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
      - org.springframework.ai.model.minimax.autoconfigure.MiniMaxChatAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  # Spring AI 配置
  ai:
    provider: ${app.llm.provider:openai}
    openai:
      api-key: ${OPENAI_API_KEY:dummy}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        # ChatModel 由 SpringAiConfig 创建，以便演示多 Provider 切换。
        enabled: false
        options:
          model: ${OPENAI_MODEL:gpt-4o}
          temperature: 0.7
    # Anthropic 配置（用于切换到 Anthropic API 兼容模型）
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:dummy}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      chat:
        enabled: false
        options:
          model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}
          temperature: 0.7
          max-tokens: 4096
    # MiniMax 配置（原生 MiniMax 模型支持）
    minimax:
      api-key: ${SPRING_AI_MINIMAX_API_KEY:dummy}
      base-url: ${SPRING_AI_MINIMAX_BASE_URL:https://api.minimax.chat}
      chat:
        enabled: false
        options:
          model: ${SPRING_AI_MINIMAX_CHAT_OPTIONS_MODEL:abab6.5g-chat}
          temperature: 0.7
    # Chat Memory JDBC 配置
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
            platform: h2
      observations:
        enabled: ${AI_OBSERVATIONS_ENABLED:false}
        log-prompt: ${AI_LOG_PROMPT:false}
        log-completion: ${AI_LOG_COMPLETION:false}
    retry:
      max-attempts: 3
      initial-interval: 1s
      multiplier: 2

  # H2 文件型数据库（数据持久化到 ./data/chat-memory.mv.db）
  datasource:
    url: jdbc:h2:file:./data/chat-memory;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 控制台（调试用）
  h2:
    console:
      enabled: false
      path: /h2-console

# SiliconFlow 嵌入模型配置（用于 VectorStoreChatMemoryAdvisor）
# ⚠️ 重要提示：base-url 千万不要带 /v1 路径！
# Spring AI 的 OpenAiEmbeddingModel 会自动在 base-url 后追加 /v1/embeddings
# 如果配置了 /v1，最终 URL 会变成 https://api.siliconflow.cn/v1/v1/embeddings，导致 404 错误！
# 正确示例：https://api.siliconflow.cn
# 错误示例：https://api.siliconflow.cn/v1 ❌
siliconflow:
  api-key: ${SILICONFLOW_API_KEY:}
  base-url: ${SILICONFLOW_URL:https://api.siliconflow.cn}
  model: ${SILICONFLOW_MODEL:BAAI/bge-m3}
  # 部分 OpenAI-compatible Embedding 服务（例如 BAAI/bge-m3）不接受 dimensions
  # 请求参数。默认不发送该参数，由服务端返回模型原生维度；只有确认 provider 支持
  # 该参数时，同时设置 SILICONFLOW_DIMENSIONS_ENABLED=true。
  dimensions: ${SILICONFLOW_DIMENSIONS:}
  dimensions-enabled: ${SILICONFLOW_DIMENSIONS_ENABLED:false}

# 知识库配置
knowledge-base:
  paths: ${KNOWLEDGE_BASE_PATHS:classpath:knowledge-base/*.md}
  fail-fast: ${KNOWLEDGE_BASE_FAIL_FAST:false}

management:
  observations:
    enabled: ${AI_OBSERVATIONS_ENABLED:false}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.0}

app:
  skills:
    locations: ${SKILL_LOCATIONS:classpath*:skills}
  llm:
    provider: ${LLM_PROVIDER:openai}
  api:
    base-url: ${API_BASE_URL:http://localhost:${server.port:8080}}
  ai:
    rag:
      enabled: ${RAG_ENABLED:false}
    vector-memory:
      enabled: ${VECTOR_MEMORY_ENABLED:false}
    log-system-prompt: ${AI_LOG_SYSTEM_PROMPT:false}
    stream-timeout-ms: ${AI_STREAM_TIMEOUT_MS:180000}
    http:
      connect-timeout: ${AI_HTTP_CONNECT_TIMEOUT:30s}
      read-timeout: ${AI_HTTP_READ_TIMEOUT:120s}
    vector-store:
      knowledge-file: ${KNOWLEDGE_VECTOR_STORE_FILE:./data/vector-store.json}
      chat-memory-file: ${CHAT_MEMORY_VECTOR_STORE_FILE:./data/chat-memory-vector-store.json}
      knowledge-table: ${KNOWLEDGE_VECTOR_TABLE:vector_store}
      chat-memory-table: ${CHAT_MEMORY_VECTOR_TABLE:chat_memory_vector_store}
      distance-type: ${VECTOR_DISTANCE_TYPE:COSINE_DISTANCE}
      index-type: ${VECTOR_INDEX_TYPE:HNSW}
      dimensions: ${SILICONFLOW_DIMENSIONS:1024}
  internal-http:
    connect-timeout: ${INTERNAL_HTTP_CONNECT_TIMEOUT:5s}
    read-timeout: ${INTERNAL_HTTP_READ_TIMEOUT:15s}

# 视觉模型配置（火山方舟/豆包视觉）
vision:
  base-url: ${VISION_BASE_URL:}
  api-key: ${VISION_API_KEY:}
  model: ${VISION_MODEL:}

# 语音转写配置（智谱 GLM-ASR）
transcription:
  base-url: ${TRANSCRIPTION_BASE_URL:}
  api-key: ${TRANSCRIPTION_API_KEY:}
  model: ${TRANSCRIPTION_MODEL:}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

logging:
  level:
    com.example.demo: ${APP_LOG_LEVEL:INFO}
    org.springframework.ai: ${SPRING_AI_LOG_LEVEL:INFO}
