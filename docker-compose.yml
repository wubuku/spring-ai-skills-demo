# Spring AI Skills Demo - Docker Compose 配置
# 默认使用 H2；PostgreSQL 模式通过 SPRING_PROFILES_ACTIVE=postgresql 和
# SPRING_DATASOURCE_* 显式启用。

services:
  # Java 后端服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-ai-skills-demo
    ports:
      - "8080:8080"
    environment:
      # LLM 配置（必需）
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      
      # Anthropic 配置（可选）
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      
      # LLM Provider 选择（openai 或 anthropic）
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      
      # RAG / 向量记忆默认关闭；启用时必须配置 SiliconFlow
      - RAG_ENABLED=${RAG_ENABLED:-false}
      - VECTOR_MEMORY_ENABLED=${VECTOR_MEMORY_ENABLED:-false}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - SILICONFLOW_URL=${SILICONFLOW_URL:-https://api.siliconflow.cn}
      - SILICONFLOW_MODEL=${SILICONFLOW_MODEL:-BAAI/bge-m3}
      - SILICONFLOW_DIMENSIONS=${SILICONFLOW_DIMENSIONS:-1024}
      - SILICONFLOW_DIMENSIONS_ENABLED=${SILICONFLOW_DIMENSIONS_ENABLED:-false}
      
      # 视觉模型配置（可选）
      - VISION_BASE_URL=${VISION_BASE_URL:-}
      - VISION_API_KEY=${VISION_API_KEY:-}
      - VISION_MODEL=${VISION_MODEL:-}
      
      # 语音转写配置（可选）
      - TRANSCRIPTION_BASE_URL=${TRANSCRIPTION_BASE_URL:-}
      - TRANSCRIPTION_API_KEY=${TRANSCRIPTION_API_KEY:-}
      - TRANSCRIPTION_MODEL=${TRANSCRIPTION_MODEL:-}
      
      # 数据库配置（默认使用 H2；PostgreSQL 模式取消注释）
      # - SPRING_PROFILES_ACTIVE=postgresql
      # - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/spring-ai-skills-demo}
      # - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      # - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-}
    volumes:
      # 挂载数据卷用于持久化 H2 数据库和向量存储
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/products"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL + pgvector 服务（可选，取消注释以启用）
